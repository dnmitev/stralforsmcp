{{- range $k := list "internal" "public" }}
{{- $i := index $.Values.ingress $k }}
{{- if $i.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stralforsmcp.fullname" $ }}-{{ $k }}
  labels:
    {{- include "stralforsmcp.labels" $ | nindent 4 }}
  {{- with $i.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $i.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $i.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "stralforsmcp.fullname" $ }}
                port:
                  number: 3000
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
