apiVersion: v1
kind: Service
metadata:
  name: {{ include "stralforsmcp.fullname" . }}
  labels:
    {{- include "stralforsmcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stralforsmcp.selector" . | nindent 4 }}
  ports:
    - name: mcp
      port: 3000
      targetPort: mcp
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stralforsmcp.fullname" . }}-metrics
  labels:
    {{- include "stralforsmcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stralforsmcp.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
