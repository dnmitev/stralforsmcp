{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stralforsmcp.fullname" . }}-dashboard
  labels:
    {{- include "stralforsmcp.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  stralforsmcp.json: {{ .Files.Get "dashboards/stralforsmcp.json" | replace "__UID__" .Values.grafanaDashboard.uid | toJson }}
{{- end }}
