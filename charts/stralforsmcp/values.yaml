# Nothing in this file is a credential. Secrets are referenced by name only.
image:
  repository: ghcr.io/dnmitev/stralforsmcp
  # tag has no default and is required.
  pullPolicy: IfNotPresent
  # optional "sha256:..." digest; when set it replaces the tag in the image reference
  digest: ""

stralfors:
  env: test            # test | prod
  allowWrite: false    # refused with env=prod
  prodValidateEnabled: null   # emitted only when set to true or false
  certReloadS: 60
  timeoutMs: null

# One entry per profile; secretName is a Secret holding client-id, client-secret,
# client.pem, client.key and optionally key-passphrase and action-ids.
profiles: []
# - id: example-profile
#   country: XX
#   secretName: example-profile-creds
#   passphrase: false

tokenList:
  secretName: ""
  key: token-list.json

extraHostnames: []
origins: []

otlp:
  endpoint: ""
  headersSecret:
    name: ""
    key: headers

replicas: 1
# Shutdown (ADR 0023): the server turns /readyz to 503 on SIGTERM, keeps serving for
# readyDelayMs (endpoint propagation), then drains for drainMs. Rendering fails unless
# terminationGracePeriodSeconds * 1000 > readyDelayMs + drainMs + 8000 (3 s client close + 5 s flush).
# There is no preStop hook: the image has no shell or sleep and the server delays itself.
readyDelayMs: 5000
drainMs: 10000
terminationGracePeriodSeconds: 30

# Node old-space limit in MiB: about 75 % of resources.limits.memory (256Mi -> 192).
heapMaxMb: 192

# Optional server settings; omitted from the pod when empty.
logLevel: ""          # MCP_LOG_LEVEL
rate:
  perMinute: null     # MCP_RATE_PER_MINUTE
  burst: null         # MCP_RATE_BURST
# Any other server variable (see README): [{name: MCP_TOOL_OUTPUT_MAX_BYTES, value: "65536"}].
# Names the chart sets itself, and MCP_PORT / MCP_LISTEN_HOST / MCP_METRICS_PORT / MCP_METRICS_HOST
# (probes and Services assume the fixed ports), are rejected. Values must be strings (quote numbers). Secrets still go by file path (ADR 0005).
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  annotations: {}

ingress:
  internal: &ingress
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  public:
    <<: *ingress

# Set both namespaces to your cluster's real ones (controller and scraper) before installing or
# upgrading: with an enforcing CNI the defaults only admit traffic from namespaces named
# `ingress` and `monitoring`, and the route or scrape stops working otherwise.
networkPolicy:
  enabled: true
  prometheusNamespace: monitoring
  ingressControllerNamespace: ingress

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
