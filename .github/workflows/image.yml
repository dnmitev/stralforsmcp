name: image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every event. No secrets, no registry login, nothing is pushed.
  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: stralforsmcp:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Same final stage for arm64, built and scanned but never started (the build stage runs on
      # $BUILDPLATFORM, so no QEMU). publish pushes this platform, so it gets the same gate.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=docker,dest=${{ runner.temp }}/arm64.tar
          push: false
          provenance: false
          tags: stralforsmcp:scan-arm64
          cache-from: type=gha
      - id: today
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.today.outputs.d }}
          restore-keys: trivy-db-
      - name: Install trivy (pinned sha256)
        run: |
          f=trivy_0.76.2_Linux-64bit.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/$f"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy
      - name: SBOM and full report
        run: |
          "$RUNNER_TEMP/trivy" image --format cyclonedx --output sbom.cdx.json stralforsmcp:scan
          # informational: includes unfixed findings
          "$RUNNER_TEMP/trivy" image --severity HIGH,CRITICAL --format table --output trivy-report.txt stralforsmcp:scan
      - name: Image content
        run: |
          cid=$(docker create stralforsmcp:scan)
          docker export "$cid" | tar -t > files.txt
          docker rm "$cid"
          # dependency test files and .package-lock.json under node_modules are expected; everything else is not
          if grep -v '^app/node_modules/' files.txt | grep -E '\.test\.ts$|^app/(test|scripts|docs|reports)/|\.paul|CLAUDE|package-lock\.json|\.pem$|\.key$|token-list|^bin/sh|^usr/bin/npm'; then exit 1; fi
          grep -q '^app/src/server/main.ts$' files.txt
      - name: Smoke test
        run: node scripts/image-smoke.ts stralforsmcp:scan
      - name: Gate (fixable HIGH/CRITICAL)
        env:
          TRIVY_SKIP_JAVA_DB_UPDATE: 'true'
        run: '"$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --ignorefile .trivyignore.yaml stralforsmcp:scan'
      - name: Gate arm64 (fixable HIGH/CRITICAL)
        env:
          TRIVY_SKIP_JAVA_DB_UPDATE: 'true'
        run: '"$RUNNER_TEMP/trivy" image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --ignorefile .trivyignore.yaml --input "$RUNNER_TEMP/arm64.tar"'
      - name: Dockerfile config
        run: '"$RUNNER_TEMP/trivy" config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml Dockerfile'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-sbom-and-scan
          path: |
            sbom.cdx.json
            trivy-report.txt
          if-no-files-found: warn
          retention-days: 14

  # Push to main or a v* tag only, never a pull request or a fork.
  publish:
    needs: build-scan
    if: github.event_name == 'push' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
