name: rescan

# A new vulnerability can be disclosed against an image that was clean when it was published. This re-scans the published
# main build every week, so it shows up as a failed run even when nothing is pushed. Read-only; a red run notifies the owner.
# The published tag is `edge` (main) until the first release exists.

on:
  schedule:
    - cron: '43 4 * * 2'
  workflow_dispatch:

concurrency:
  group: rescan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rescan:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy (pinned sha256)
        run: |
          f=trivy_0.76.2_Linux-64bit.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/$f"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy
      - name: Scan the published image (fixable HIGH/CRITICAL, both platforms)
        env:
          TRIVY_SKIP_JAVA_DB_UPDATE: 'true'
          # registry credentials for the read; no docker login step, nothing is stored on the runner
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:edge"
          for p in linux/amd64 linux/arm64; do
            "$RUNNER_TEMP/trivy" image --platform "$p" --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --ignorefile .trivyignore.yaml "$image"
          done
