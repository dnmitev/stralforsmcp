name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Two cheap path checks over the whole pull request (renames count by old and new path; any doubt means "not skipped"):
  # - docs only (docs/, README.md, GLOSSARY.md and similar project docs, LICENSE): mutation is skipped and review/confidence is posted as not applicable.
  # - docs or pipeline/deploy files only (.github/, charts/, Dockerfile, ignore and scanner configs): mutation is skipped;
  #   the review gate stays, because CI and deploy changes still deserve a review.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      mutation: ${{ steps.scope.outputs.mutation }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "mutation=run" >> "$GITHUB_OUTPUT"
          [ "$EVENT" = pull_request ] || exit 0
          # One listing gives filename, count and old path together; the PR head and its file count are checked after it.
          rows=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[] | [.filename, (.previous_filename // "")] | @tsv') || exit 0
          [ -n "$rows" ] || exit 0
          # The files endpoint stops at 3,000 entries; the head must still be the event commit, the count the PR's own.
          meta=$(gh api "repos/$REPO/pulls/$PR" -q '.changed_files, .head.sha') || exit 0
          [ "$(printf '%s\n' "$rows" | wc -l | tr -d ' ')" = "$(printf '%s\n' "$meta" | sed -n 1p)" ] || exit 0
          [ "$(printf '%s\n' "$meta" | sed -n 2p)" = "$HEAD_SHA" ] || exit 0
          # A rename counts as both its old and new path (a rename out of .claude/ into docs/ is not docs-only).
          paths=$(printf '%s\n' "$rows" | tr '\t' '\n' | grep -v '^$' || true)
          docs='^docs/|^(README|GLOSSARY|CHANGELOG|CONTRIBUTING|SECURITY)\.md$|^LICENSE$'
          ops='^\.github/|^charts/|^Dockerfile$|^\.dockerignore$|^\.trivyignore\.yaml$|^\.gitleaks\.toml$|^\.coderabbit\.yaml$'
          other=$(printf '%s\n' "$paths" | grep -vE "$docs|$ops" || true)
          [ -z "$other" ] || exit 0
          echo "mutation=skip" >> "$GITHUB_OUTPUT"
          notdocs=$(printf '%s\n' "$paths" | grep -vE "$docs" || true)
          [ -z "$notdocs" ] || exit 0
          [ "$SAME_REPO" = true ] || exit 0
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=success -f context=review/confidence \
            -f description="docs only: no review needed"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check
      - name: Report
        if: always()
        run: |
          node scripts/ci-report.ts reports/coverage/coverage-summary.json reports/junit.xml > body.md || echo "_report unavailable_" > body.md
          { echo "### Node ${{ matrix.node }}"; echo; cat body.md; } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-node-${{ matrix.node }}
          path: |
            report.md
            reports/
          if-no-files-found: warn
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pulls the digest-pinned WireMock image from Docker Hub (ADR 0019); Docker and openssl are preinstalled on the runner.
      - run: npm run test:integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: integration-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.mutation != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Incremental file: PRs fall back to the newest cache saved by main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-
      # Every ref runs incrementally without static mutants (~19% of mutants, ~87% of test time). The full --force run took
      # over 45 min on main and timed out on every push, so it moved to mutation-full.yml (weekly, 90 min).
      - name: Mutation tests (incremental)
        run: npm run mutation -- --ignoreStatic
      - name: Save incremental file
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.sha }}
      - name: Summary
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            import('./scripts/ci-report.ts').then(({ mutationScore }) => {
              let s;
              try { s = mutationScore(JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8'))); } catch {}
              console.log('### Mutation score\n\n' + (s === undefined ? 'n/a' : s.toFixed(1) + '%'));
            });
          " >> "$GITHUB_STEP_SUMMARY"
      # Inert without the secret: nothing is sent. The re-run is cheap (incremental file).
      - name: Stryker dashboard (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          if [ -z "$STRYKER_DASHBOARD_API_KEY" ]; then
            echo "dashboard key not set, skipped"
            exit 0
          fi
          npx stryker run --ignoreStatic --reporters clear-text,dashboard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14

  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml'
      - name: Denylist
        env:
          DL: ${{ secrets.STRALFORSMCP_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$DL" ]; then
            echo "::warning::denylist secret not available, skipped"
            exit 0
          fi
          umask 077
          printf '%s\n' "$DL" > "$RUNNER_TEMP/denylist"
          export STRALFORSMCP_DENYLIST="$RUNNER_TEMP/denylist"
          git ls-files -z | xargs -0 cat | sh scripts/denylist-check.sh
          # Commit metadata of the whole history: names, emails, messages (catches web squash-merge authors on push to main).
          git log --format='%an%n%ae%n%cn%n%ce%n%B' HEAD | sh scripts/denylist-check.sh
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | sh scripts/denylist-check.sh
          fi

  pr-comment:
    needs: check
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: report-node-24
          path: dl
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "<!-- stralforsmcp-ci-report -->"
            if [ -f dl/report.md ]; then cat dl/report.md; else echo "_report unavailable_"; fi
            echo
            echo "Other Node versions: see the job summary of this run."
          } > body.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file body.md
