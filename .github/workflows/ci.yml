name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check
      - name: Report
        if: always()
        run: |
          node scripts/ci-report.ts reports/coverage/coverage-summary.json reports/junit.xml > body.md || echo "_report unavailable_" > body.md
          { echo "### Node ${{ matrix.node }}"; echo; cat body.md; } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-node-${{ matrix.node }}
          path: |
            report.md
            reports/
          if-no-files-found: warn
          retention-days: 14

  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml'
      - name: Denylist
        env:
          DL: ${{ secrets.STRALFORSMCP_DENYLIST }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$DL" ]; then
            echo "::warning::denylist secret not available, skipped"
            exit 0
          fi
          umask 077
          printf '%s\n' "$DL" > "$RUNNER_TEMP/denylist"
          export STRALFORSMCP_DENYLIST="$RUNNER_TEMP/denylist"
          git ls-files -z | xargs -0 cat | sh scripts/denylist-check.sh
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags origin "$BASE_REF"
            git log --format=%B "origin/$BASE_REF..HEAD" | sh scripts/denylist-check.sh
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | sh scripts/denylist-check.sh
          fi

  pr-comment:
    needs: check
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: report-node-24
          path: dl
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "<!-- stralforsmcp-ci-report -->"
            if [ -f dl/report.md ]; then cat dl/report.md; else echo "_report unavailable_"; fi
            echo
            echo "Other Node versions: see the job summary of this run."
          } > body.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file body.md
