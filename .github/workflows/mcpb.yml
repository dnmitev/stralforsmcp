name: mcpb

# Builds the Claude Desktop extension from a clean checkout, checks it, and publishes it as a workflow artifact with a SHA-256.
# A v* tag additionally gets a build-provenance attestation. This workflow never creates a release (that is a maintainer step).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: mcpb-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run mcpb:build
      - name: Verify
        run: node scripts/mcpb-verify.ts dist/stralforsmcp.mcpb
      - name: Checksum
        working-directory: dist
        run: sha256sum stralforsmcp.mcpb | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: |
            dist/stralforsmcp.mcpb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # Tag pushes only. The only job with id-token and attestations permissions.
  attest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: mcpb
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mcpb/stralforsmcp.mcpb
