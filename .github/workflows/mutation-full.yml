name: mutation-full

# The full Stryker run (static mutants included, --force) takes over 45 min, too long for every push to main.
# It runs weekly and on demand, and saves a fresh incremental baseline (a run-unique cache key, caches are immutable) that PR and main runs restore through the `stryker-` prefix.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation-full
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mutation tests (full)
        run: npm run mutation -- --force
      - name: Save incremental file
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-full-${{ github.run_id }}
      - name: Summary
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            import('./scripts/ci-report.ts').then(({ mutationScore }) => {
              let s;
              try { s = mutationScore(JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8'))); } catch {}
              console.log('### Mutation score (full)\n\n' + (s === undefined ? 'n/a' : s.toFixed(1) + '%'));
            });
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-full
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
