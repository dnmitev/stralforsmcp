name: mutation-full

# The full Stryker run (static mutants included, --force): about 13 min locally since 2026-11-21 (was over 45 min), still too long for every push.
# It runs weekly and on demand and gates on the break threshold. On main its clean incremental file becomes the newest
# baseline of ci.yml's cache chain (same config-hash prefix), which clears drift from changed helpers or unmutated imports.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation-full
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mutation tests (full)
        run: npm run mutation -- --force
      - name: Safety file ceilings
        if: success() || failure()
        run: |
          node -e "
            const fs = require('node:fs');
            import('./scripts/ci-report.ts').then(({ safetyViolations }) => {
              let r = null;
              try { r = JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8')); } catch {}
              const v = safetyViolations(r);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Safety file ceilings\\n\\n' + (v.length ? v.map((l) => '- ' + l).join('\\n') : 'all within ceiling') + '\\n');
              if (v.length) { console.error(v.join('\\n')); process.exit(1); }
            });
          "
      - name: Save incremental baseline
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ hashFiles('stryker.config.json', 'vitest.stryker.config.ts') }}-${{ github.sha }}-full
      - name: Summary
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            import('./scripts/ci-report.ts').then(({ mutationScore }) => {
              let s;
              try { s = mutationScore(JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8'))); } catch {}
              console.log('### Mutation score (full)\n\n' + (s === undefined ? 'n/a' : s.toFixed(1) + '%'));
            });
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-full
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
